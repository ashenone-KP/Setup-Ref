{% extends 'layouts/dashboard.html' %}
{% block title %}Edit profile &middot; SupervisorMatch{% endblock %}
{% block page_title %}Edit profile{% endblock %}

{% block content %}
<div class="card" style="max-width:580px;">
  <form method="post" action="{{ url_for('staff.profile') }}">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" value="{{ current_user.name }}" required>
    </div>
    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ current_user.title or '' }}"
             placeholder="e.g. Dr, Senior Lecturer">
    </div>
    <div class="field">
      <label for="bio">Bio</label>
      <textarea id="bio" name="bio" placeholder="A short description of your work">{{ current_user.bio or '' }}</textarea>
    </div>
    <div class="field">
      <label for="capacity">Supervision capacity</label>
      <input type="number" id="capacity" name="capacity" min="0"
             value="{{ current_user.capacity if current_user.capacity is not none else 4 }}">
    </div>
    <button type="submit" class="btn btn-primary">Save profile</button>
  </form>
</div>
{% endblock %}

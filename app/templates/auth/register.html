{% extends 'base.html' %}
{% block title %}Sign up &middot; SupervisorMatch{% endblock %}

{% block body %}
<div class="auth-page">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="brand-tile">SM</div>
      <h1>Create your account</h1>
      <p>Join as a student or a member of staff</p>
    </div>

    {% include 'partials/_flashes.html' %}

    <div class="card auth-card">
      <form method="post" action="{{ url_for('auth.register') }}">
        <label>I am a&hellip;</label>
        <div class="role-toggle">
          <label>
            <input type="radio" name="role" value="student" {{ 'checked' if role != 'staff' else '' }}>
            Student
          </label>
          <label>
            <input type="radio" name="role" value="staff" {{ 'checked' if role == 'staff' else '' }}>
            Staff
          </label>
        </div>

        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" value="{{ name or '' }}" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}"
                 placeholder="name@myport.ac.uk" required>
        </div>
        <div class="field">
          <label for="password">Password <span class="muted small">(min 6 characters)</span></label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
    </div>

    <p class="auth-alt">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}

{# Inline stroke icons (24x24, currentColor). Usage: {{ icon('search') }} #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'dashboard' -%}
  <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
  <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
{%- elif name == 'user' -%}
  <circle cx="12" cy="8" r="4"/><path d="M4 21c0-3.3 3.6-6 8-6s8 2.7 8 6"/>
{%- elif name == 'users' -%}
  <circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3 3.1-5 7-5s7 2 7 5"/>
  <path d="M16 5.2a3.5 3.5 0 0 1 0 6.6"/><path d="M18 14.4c2.4.6 4 2.2 4 4.6"/>
{%- elif name == 'search' -%}
  <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
{%- elif name == 'tag' -%}
  <path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.3"/>
{%- elif name == 'idea' -%}
  <path d="M9 18h6"/><path d="M10 21h4"/>
  <path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.4 1 2.5h6c0-1.1.3-1.8 1-2.5A6 6 0 0 0 12 3z"/>
{%- elif name == 'inbox' -%}
  <path d="M3 12h5l2 3h4l2-3h5"/><path d="M4 12 6 5h12l2 7v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>
{%- elif name == 'star' -%}
  <path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.7l5.9-.9z"/>
{%- elif name == 'sliders' -%}
  <path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/>
  <path d="M20 21v-5"/><path d="M20 12V3"/><circle cx="4" cy="12" r="2"/>
  <circle cx="12" cy="10" r="2"/><circle cx="20" cy="14" r="2"/>
{%- elif name == 'logout' -%}
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == 'plus' -%}
  <path d="M12 5v14"/><path d="M5 12h14"/>
{%- elif name == 'edit' -%}
  <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
{%- elif name == 'trash' -%}
  <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
  <path d="M6 6l1 14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-14"/>
{%- elif name == 'check' -%}
  <path d="M20 6 9 17l-5-5"/>
{%- elif name == 'x' -%}
  <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
{%- elif name == 'back' -%}
  <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
{%- elif name == 'cap' -%}
  <path d="M12 4 2 9l10 5 10-5z"/><path d="M6 11v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>
{%- elif name == 'send' -%}
  <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>
{%- elif name == 'shield' -%}
  <path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/>
{%- endif -%}
</svg>
{%- endmacro %}
